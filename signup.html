<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Register for Resources</h1>
</header>

<main>

<section>
    <p>Fill in your details to access curated learning resources.</p>
</section>

<form>

<input type="text" placeholder="Full Name">
<input type="number" placeholder="Contact Number">
<input type="email" placeholder="Email Address">
<input type="password" placeholder="Password">

<p>Gender</p>
<label><input type="radio" name="gender"> Male</label>
<label><input type="radio" name="gender"> Female</label>

<p>Courses</p>
<label><input type="checkbox"> HTML</label>
<label><input type="checkbox"> CSS</label>
<label><input type="checkbox"> JavaScript</label>

<p>Budget</p>
<select>
<option>Select</option>
<option>1k - 4k</option>
<option>5k - 9k</option>
</select>

<textarea placeholder="Suggestions"></textarea>

<input type="submit" value="Submit">

</form>

<section>
    <video src="assets\video\screenrecord.mp4" controls></video>
</section>

<a href="index.html">Back to Home</a>

</main>

<footer></footer>

</body>
</html>
